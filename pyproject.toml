[project]
name = "prior-auth-appeals"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bitsandbytes>=0.45",
    "accelerate>=1.0",
    "transformers>=4.51.0,<5",
    "torch>=2.5",
    "anthropic>=0.120.2",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.7.0",
    "langchain-core>=1.6.9",
    "langchain-text-splitters>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-chroma>=1.1.0",
    "fastapi[standard]>=0.143.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
# Minimal runtime for the saved-results API (Docker image).
# Installed with --only-group, which skips the inference dependencies above.
api = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]
# API runtime plus test tooling for CI.
api-test = [
    { include-group = "api" },
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
